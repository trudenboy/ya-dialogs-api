[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ya-dialogs-api"
dynamic = ["version"]
description = "Yandex Dialogs Developer API client — programmatic skill creation, draft management, OAuth Device Flow"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Mikhail Nevskiy" }]
keywords = [
    "yandex",
    "dialogs",
    "alice",
    "skill",
    "api-client",
    "oauth",
    "async",
    "aiohttp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.10,<4",
    "ya-passport-auth>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "aioresponses>=0.7.6",
    "hypothesis>=6",
    "mypy>=1.11",
    "ruff>=0.6",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "cyclonedx-bom>=4",
    "liccheck>=0.9",
    "pre-commit>=3.8",
]

[project.urls]
Homepage = "https://github.com/trudenboy/ya-dialogs-api"
Repository = "https://github.com/trudenboy/ya-dialogs-api"
Issues = "https://github.com/trudenboy/ya-dialogs-api/issues"
Changelog = "https://github.com/trudenboy/ya-dialogs-api/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/ya_dialogs_api"]

[tool.hatch.build.targets.sdist]
include = [
    "src/ya_dialogs_api",
    "tests",
    "pyproject.toml",
    "VERSION",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG.md",
    "SECURITY.md",
]

# ---------------------------------------------------------------------------
# mypy — strict mode
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
# disallow_any_explicit: this lib parses arbitrary JSON from an unofficial API
# (every dev-console payload). `dict[str, Any]` is the cleanest representation.
disallow_any_explicit = false
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "ignore-without-code",
    "possibly-undefined",
]

[[tool.mypy.overrides]]
module = ["aioresponses", "aioresponses.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit
    "ASYNC",
    "RUF",  # ruff-specific
    "PL",   # pylint
    "TRY",  # tryceratops
    "PERF", # perflint
    "D",    # pydocstyle
]
ignore = [
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-summary-second-line (conflicts with D212)
    "D105",    # magic-method docstrings (class docstring is enough)
    "D107",    # __init__ docstring (class docstring is enough)
    "PLR0913", # too-many-arguments (skill-creation legitimately needs several)
    "PLR0915", # too-many-statements (long pipeline functions are fine)
    "TRY003",  # long exception messages — clarity > ceremony
    "TRY301",  # abstract `raise` to inner function — needless indirection
    "RUF001",  # ambiguous Unicode (Russian text in some constants)
    "RUF002",  # ambiguous Unicode in docstrings (Russian in docstrings)
    "RUF003",  # ambiguous Unicode in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",   # assert is fine in tests
    "S105",   # hardcoded password/token strings (fixtures)
    "S106",
    "PLR2004", # magic values in assertions
    "D",       # docstrings not required in tests
]
"src/ya_dialogs_api/api_client.py" = ["PLR2004"]  # HTTP status codes
"src/ya_dialogs_api/constants.py" = ["S105"]      # public client IDs, not secrets
"e2e_all_flows.py" = ["T20", "S101", "S105", "D", "PLR", "ASYNC250"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=ya_dialogs_api",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
testpaths = ["tests"]
xfail_strict = true
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:aiohttp.*",
]

[tool.coverage.run]
branch = true
source = ["ya_dialogs_api"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "pragma: no cover",
]

# ---------------------------------------------------------------------------
# bandit
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", "scripts"]
